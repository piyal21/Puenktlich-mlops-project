# Supported stations (Phase 1, frozen 2026-09-25). One current, non-S-Bahn EVA per station
# (API form, 7 digits) — the one live `/plan` serves the long-distance/regional trains on; older
# EVAs that were merged into it are listed under `hf_aliases`. S-Bahn and platform-group EVAs
# are not included. `state` = German subdivision code as used by the `holidays` library.
#
# Selection rules (see notebooks/01_eda.ipynb §Stations):
#   - departures on every collected day in the HF sample months 2025-10, 2026-03, 2026-08
#   - live `/plan` returns data (checked 2026-09-25)
#   - every federal state covered; mix of large hubs and smaller Hbf (low/high late rates)
#
# `hf_aliases`: retired EVAs whose HF history belongs to this station. The HF conform step
# maps them onto `eva`. Berlin Hbf: until 2026 the upper level (east-west) was 8011160 and the
# lower level 8098160; DB merged both into 8098160 (live 8011160 is empty since 2026-08).
# Berlin volume is ~460 departures/day in 2026-08 vs ~730 in 2026-03 with the alias applied: no
# third EVA and no double listing in HF → a timetable reduction, not an EVA issue.
# Stuttgart Hbf: in 2026-08 the S-Bahn EVA 8098096 has no rows and S-Bahn trains appear on
# 8000096 instead (likely a temporary diversion); live (2026-09-25) S-Bahn is back on 8098096
# → no alias.
