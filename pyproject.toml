[project]
name = "dbdelay"
version = "0.1.0"
description = "Pünktlich — Deutsche Bahn delay risk, end-to-end MLOps"
readme = "README.md"
license = "MIT"
authors = [{ name = "MD Piyal Ahmmed" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-lambda-powertools>=3.35,<4",
    "boto3>=1.43",
    "duckdb>=1.5.5",
    "holidays>=0.105",
    "pandas>=2.2,<3",
    "pandera>=0.33.1",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Installed in the Airflow image (and in the dev venv via the dev group); not in Lambda images.
# <2: huggingface-hub 2.x conflicts with packages preinstalled in the Airflow image.
pipelines = ["huggingface-hub>=0.30,<2"]
# Training-only (Phase 3+): metrics/calibration; kept out of the Lambda image.
training = [
    "lightgbm>=4.7.0",
    "mlflow-skinny>=3.16.1,<3.17",
    "scikit-learn>=1.9.1",
]
# API image (Phase 5): FastAPI + Mangum (Lambda adapter) + LightGBM; no scikit-learn.
api = [
    "fastapi>=0.142.2",
    "lightgbm>=4.7.0",
    "mangum>=0.22.0",
]

[dependency-groups]
# Local API server (compose `api` service, `make api-dev`); not in the Lambda image.
api-local = [
    "uvicorn>=0.54.0",
]
dev = [
    { include-group = "api-local" },
    "boto3-stubs[s3]>=1.43",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "huggingface-hub>=0.30,<2",
    "jupyter>=1.1.1",
    "lightgbm>=4.7.0",
    "mangum>=0.22.0",
    "matplotlib>=3.11.2",
    "mlflow-skinny>=3.16.1,<3.17",
    "moto[s3]>=5.2",
    "mypy>=2.3",
    "pandas-stubs>=2.3,<3",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "scikit-learn>=1.9.1",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "services/api"]
# Docs are prose; their code snippets are illustrations, not formatted source.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "PL"]

[tool.ruff.lint.per-file-ignores]
# assert and hardcoded test credentials are expected in tests
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
# Airflow best practice: heavy imports inside tasks, not at DAG-file top level
# (the dag-processor re-parses DAG files every ~30 s).
"pipelines/airflow/dags/**" = ["PLC0415"]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "services/api"]
strict = true
mypy_path = "src,services/api"

[[tool.mypy.overrides]]
# rules.md: strict for src/dbdelay, normal mode elsewhere
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["moto", "moto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyarrow ships no type information (stubs would be a new dependency)
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn ships no type information (stubs would be a new dependency)
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: needs the local docker compose stack (MinIO, MLflow)"]

[tool.coverage.run]
source = ["dbdelay"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
