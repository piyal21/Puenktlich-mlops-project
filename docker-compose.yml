# Local training plane (docs/architecture.md §1). Core services + Airflow (profile "airflow")
# + API and web app (profile "app", Phase 5).
# Data lives in named volumes (fast on Docker Desktop for Windows; no slow bind mounts).
# All ports bind to 127.0.0.1 → not reachable from your network.
name: puenktlich

x-airflow-common: &airflow-common
  profiles: ["airflow"]
  build:
    context: .
    dockerfile: pipelines/airflow/Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  image: puenktlich/airflow:local
  volumes:
    - ./pipelines/airflow/dags:/opt/airflow/dags:ro
    - ./pipelines/airflow/tests:/opt/airflow/tests:ro
    - ./configs:/opt/airflow/configs:ro
    - airflow-logs:/opt/airflow/logs

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run make airflow-env}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?run make airflow-env}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY:?run make airflow-env}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  STORAGE_ENDPOINT_URL: http://minio:9000
  STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
  STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
  DATA_BUCKET: ${DATA_BUCKET:-puenktlich-local}
  STATIONS_FILE: /opt/airflow/configs/stations.yaml
  TRAINING_CONFIG_FILE: /opt/airflow/configs/training.yaml
  MODELS_BUCKET: ${MODELS_BUCKET:-puenktlich-local}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_DISABLE_TELEMETRY: "true"   # owner decision 2026-10-05
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  minio:
    # Official minio/minio images are no longer published; pgsty/minio is a maintained
    # community fork of the same code (same S3 API + console).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?set STORAGE_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?set STORAGE_SECRET_ACCESS_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_USER: ${STORAGE_ACCESS_KEY_ID}
      MC_PASS: ${STORAGE_SECRET_ACCESS_KEY}
      BUCKET: ${DATA_BUCKET:-puenktlich-local}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mc alias set local http://minio:9000 "$$MC_USER" "$$MC_PASS" && mc mb --ignore-existing "local/$$BUCKET"
    restart: "no"

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mlflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mlflow:
    build: docker/mlflow
    image: puenktlich/mlflow:local
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: s3://${DATA_BUCKET:-puenktlich-local}/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: eu-central-1
      # MLflow 3 rejects Host headers other than localhost (DNS-rebinding guard); Airflow tasks
      # call it as mlflow:5000 on the compose network. Replaces the defaults, so localhost stays.
      MLFLOW_SERVER_ALLOWED_HOSTS: localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
      MLFLOW_DISABLE_TELEMETRY: "true"   # owner decision 2026-10-05
    command:
      - mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI"
        --artifacts-destination "$$MLFLOW_ARTIFACTS_DESTINATION"
        --serve-artifacts
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ---------------- Airflow 3 (Phase 2) — `make airflow-up` (profile "airflow") ----------------
  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?run make airflow-env}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        python /opt/airflow/init/create_db.py &&
        mkdir -p /opt/airflow/logs && chown -R 50000:0 /opt/airflow/logs &&
        /entrypoint airflow version
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    environment: *airflow-env
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: &after-init
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    environment: *airflow-env
    command: scheduler
    depends_on: *after-init
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    environment: *airflow-env
    command: dag-processor
    depends_on: *after-init
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------- App (Phase 5) — `make app-up` (profile "app") ----------------
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
      target: local
    image: puenktlich/api:local
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      DATA_BUCKET: ${DATA_BUCKET:-puenktlich-local}
      MODELS_BUCKET: ${MODELS_BUCKET:-puenktlich-local}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  minio-data:
  postgres-data:
  airflow-logs:
