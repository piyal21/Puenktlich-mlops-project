# Weekly dependency update PRs (Phase 8). Minor/patch updates are grouped per ecosystem to keep the
# PR count small; every Dependabot PR runs the full CI. Major updates arrive one by one for review.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /services/api
      - /services/jobs
      - /docker/mlflow
      - /pipelines/airflow
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /infra/bootstrap
      - /infra/envs/prod
    schedule:
      interval: weekly
