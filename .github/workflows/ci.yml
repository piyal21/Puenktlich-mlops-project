# CI (Phase 8, route A of ADR 0002): every pull request and every push to main is checked here.
# Deploys stay on the laptop (`make` targets) because this AWS account blocks GitHub OIDC; nothing in
# this workflow can reach AWS (no credentials, read-only token). Actions are pinned by commit SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every main commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python (lint, types, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
          enable-cache: true
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test # fails below 80 % coverage (rules.md)
      - name: pre-commit hooks (file checks, private keys, staged-secret scan)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  frontend:
    name: frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: make web-check
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --omit=dev --audit-level=high

  terraform:
    name: terraform (fmt, validate, tflint, trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The real tags live in the git-ignored tfvars on the laptop; validate needs some value.
      TF_VAR_api_image_tag: ci-validate
      TF_VAR_jobs_image_tag: ci-validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.59.1
      - run: make tf-fmt
      - run: make tf-validate
      - run: tflint --chdir infra --recursive
      - run: make tf-scan

  security:
    name: security (gitleaks history, pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 git --redact --verbose /repo # v8.30.0
      - name: pip-audit (both Lambda images, local MLflow image)
        # GHSA-j7qq-vr8c-xvw3: mlflow 3.16.1 server, fixed in 3.17.0. Local-only (127.0.0.1) tracking
        # server; upgrade together with the mlflow-skinny training client (CHANGELOG known gap).
        run: >-
          uvx pip-audit==2.9.0 --disable-pip --require-hashes
          -r services/api/requirements.txt -r services/jobs/requirements.txt
          && uvx pip-audit==2.9.0 --disable-pip --require-hashes -r docker/mlflow/requirements.txt
          --ignore-vuln GHSA-j7qq-vr8c-xvw3

  images:
    name: images (locked requirements, docker build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.18"
      - name: requirements files match uv.lock
        run: |
          make api-requirements jobs-requirements
          git diff --exit-code -- services/api/requirements.txt services/api/requirements-local.txt services/jobs/requirements.txt
      - run: docker build --platform linux/amd64 --target lambda -f services/api/Dockerfile -t puenktlich-api:ci .
      - run: docker build --platform linux/amd64 -f services/jobs/Dockerfile -t puenktlich-jobs:ci .
      - name: trivy image scan (fail on fixable HIGH/CRITICAL)
        run: make image-scan IMAGES="puenktlich-api:ci puenktlich-jobs:ci"
